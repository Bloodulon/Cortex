version: '3.8'

services:
  app:
    build: ./bot
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./bot/.env
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-quiz_db}
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: