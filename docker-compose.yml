services:
  bot:
    build: ./bot
    restart: unless-stopped
    env_file: ./bot/.env
    volumes:
      - ./bot:/app
    ports:
      - "8000:8000"

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "3000:80"